  .haze{
    position:fixed; inset:0; z-index:1;
    background: radial-gradient(ellipse 70% 50% at 50% 15%, rgba(255,230,180,0.25), transparent 65%);
  }
  .vignette{
    position:fixed; inset:0; z-index:2;
    background: radial-gradient(ellipse 90% 70% at 50% 30%, transparent 40%, rgba(10,6,3,0.55) 100%);
  }

  .page{
    position:relative;
    z-index:3;
    width:100%;
    max-width:400px;
    padding:56px 24px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .avatar-wrap{
    position:relative;
    width:150px;
    height:150px;
    margin-bottom:22px;
  }

  .avatar-glow{
    position:absolute; inset:-14px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,224,170,0.55), transparent 70%);
    filter: blur(4px);
    opacity:0;
    animation: glow-in 1.4s ease-out 0.1s forwards;
  }
  @keyframes glow-in{ to{ opacity:1; } }

  .avatar{
    position:relative;
    width:150px; height:150px;
    border-radius:50%;
    border:3px solid rgba(255,238,210,0.85);
    background: linear-gradient(160deg,#2b2118,#0f0b08);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    box-shadow: 0 0 30px rgba(255,210,140,0.35);
  }
  .avatar-placeholder{
    font-family:'Playfair Display', serif;
    font-size:54px;
    color:rgba(245,239,227,0.55);
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

  h1{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:38px;
    letter-spacing:0.5px;
    margin-bottom:14px;
    text-shadow: 0 2px 18px rgba(0,0,0,0.4);
  }

  .divider{
    display:flex; align-items:center; gap:10px;
    color:var(--text-muted);
    margin-bottom:18px;
  }
  .divider .line{ width:60px; height:1px; background:rgba(245,239,227,0.4); }
  .divider .diamond{ font-size:12px; transform:translateY(-1px); }

  .tagline{
    font-family:'Caveat', cursive;
    font-size:26px;
    color:var(--text-primary);
    margin-bottom:34px;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:15px 18px;
    background:var(--card-bg);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border:1px solid var(--card-border);
    border-radius:999px;
    text-decoration:none;
    color:var(--text-primary);
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .link-card:hover, .link-card:focus-visible{
    transform:translateY(-2px);
    background:rgba(30,22,14,0.55);
    border-color:rgba(245,239,227,0.4);
  }
  .link-card:focus-visible{ outline:2px solid var(--text-primary); outline-offset:2px; }

  /* floating embers */
  .particles{ position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .particle{
    position:absolute;
    bottom:-10px;
    width:4px; height:4px;
    border-radius:50%;
    background:rgba(255,206,130,0.85);
    box-shadow:0 0 6px 2px rgba(255,180,90,0.5);
    animation-name: ember-rise;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
    opacity:0;
  }
  @keyframes ember-rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.9; }
    80%{ opacity:0.5; }
    100%{ transform:translateY(-100vh) translateX(20px); opacity:0; }
  }

  /* shimmering divider star */
  .diamond{ display:inline-block; animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle{
    0%,100%{ opacity:0.5; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.3); }
  }

  /* staggered entrance */
  @keyframes fade-up{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .avatar-wrap, h1, .tagline, footer .divider, footer .credit{
    animation: fade-up 0.7s ease-out both;
  }
  .avatar-wrap{ animation-delay:0.05s; }
  h1{ animation-delay:0.15s; }
  .tagline{ animation-delay:0.3s; }
  .link-card{ animation: fade-up 0.6s ease-out both; }
  .link-card:nth-child(1){ animation-delay:0.4s; }
  .link-card:nth-child(2){ animation-delay:0.5s; }
  .link-card:nth-child(3){ animation-delay:0.6s; }
  .link-card:nth-child(4){ animation-delay:0.7s; }

  .icon{
    flex:0 0 auto;
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.35);
  }
  .icon svg{ width:20px; height:20px; }

  .link-text{ flex:1; text-align:left; }
  .link-title{ font-size:15px; font-weight:600; margin-bottom:2px; }
  .link-sub{ font-size:12.5px; color:var(--text-muted); }
  .arrow{ flex:0 0 auto; color:var(--text-muted); font-size:16px; }
